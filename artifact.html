  <article class="guide-article">
    <section id="location-challenge" aria-labelledby="location-challenge-h">
      <h2 id="location-challenge-h">The Challenge</h2>
      <p>How can your organization find a location that is not only suitable for your activities and target audience, but also affordable? This is one of the biggest challenges many organizations face. Yet, several members of the Community of Practice have managed to find suitable and affordable locations in various ways.</p>
      <p class="guide-question">How do you make sure you find a fitting location?</p>
    </section>

    <section id="location-experience" aria-labelledby="location-experience-h">
      <h2 id="location-experience-h">From Experience: What (Not) To Do</h2>
      <ul class="guide-bullets">
        <li>Few organizations manage to have their own building. It often costs a lot of money.</li>
        <li>Avoid tunnel vision and don’t focus on finding one single location for all your activities. Be willing to make compromises. For example, be open to offering different activities at different locations.</li>
        <li>Find another organization or foundation with whom you can rent and share a space. Make clear agreements about who will use the space and when.</li>
        <li>Keep in mind that locations have their own rules about what you can and cannot do there. Sometimes you find a location, but it turns out not to be suitable for your activity or gathering.</li>
        <li>If you find a location you share with other organizations, take other users into account.</li>
      </ul>
    </section>

    <section id="location-steps" aria-labelledby="location-steps-h">
      <h2 id="location-steps-h">Step-By-Step Plan</h2>
      <ol class="guide-steps">
        <li>
          <h3>Step 1: Create a search profile</h3>
          <p>First, clarify exactly what you are looking for. The help questions can assist you with this. To find a space more quickly, it may be useful to offer different activities at different locations.</p>
        </li>
        <li>
          <h3>Step 2: Reach out</h3>
          <p>Contact the Community Builder, neighborhood manager, or WJP representative in the neighborhood where you are organizing the activity. They can connect you with local contacts and provide information about available spaces and subsidies.</p>
        </li>
        <li>
          <h3>Step 3: Look into community rooms</h3>
          <p>Find out if there are any community rooms in the neighborhood or district. Ask if you can use them. Community rooms are often not suitable for large activities or gatherings, but they are suitable for meetings.</p>
        </li>
        <li>
          <h3>Step 4: Join meetings</h3>
          <p>Join neighborhood meetings to stay informed, discuss your needs, and connect with neighborhood organizations.</p>
        </li>
        <li>
          <h3>Step 5: Create an overview</h3>
          <p>Make an overview of neighborhood organizations and community centers with their own buildings. Search online or visit them, introduce yourself, and inquire about rentals and prices.</p>
        </li>
        <li>
          <h3>Step 6: Location found</h3>
          <p>Once you have found a suitable location, make sure you know immediately who the manager is who also has the keys/access. This will save time when your activity or meeting is about to start.</p>
        </li>
      </ol>
    </section>

    <section id="location-checklist" aria-labelledby="location-checklist-h">
      <h2 id="location-checklist-h">Checklist</h2>
      <ul class="guide-checklist">
        <li><label class="guide-check"><input type="checkbox"><span><strong>What type(s) of activity or meeting are you going to organize?</strong><br><span class="guide-small">What kind of hall or room do you need for that?<br>How many halls or rooms do you need?</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span><strong>Which target group(s) are you focusing on?</strong><br><span class="guide-small">(For example: young children, teenagers, adults?)</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span><strong>How many people are involved?</strong></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span><strong>What do you need for your meeting?</strong><br><span class="guide-small">Think of items such as a projector, flip chart, sound system, etc.</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span><strong>Does the location also need to be wheelchair accessible?</strong><br><span class="guide-small">Does the location also need to have an elevator?</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span><strong>Is it important that the location is easily accessible by public transport?</strong><br><span class="guide-small">Or do you find it important that there are enough parking spaces nearby for cars, bicycles, etc?</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span><strong>Is your organization tied to a specific neighborhood or district?</strong><br><span class="guide-small">Or are you active in multiple parts of the city?</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span><strong>Does the activity or meeting need to take place in a specific neighborhood or district?</strong><br><span class="guide-small">Or does that not matter?</span></span></label></li>
      </ul>
    </section>

    <section id="location-dos" aria-labelledby="location-dos-h">
      <h2 id="location-dos-h">Do’s And Don’t’s</h2>
      <div class="guide-dos-group">
        <h3>DO</h3>
        <ul class="guide-dos">
          <li><img src="assets/img/guide-location/tick.svg" alt="Do:" width="25" height="25" loading="lazy"><p>Create a cost overview of your ideal location in advance.<br>Think about rent, insurance, gas/water/electricity, and renovation. The clearer and more concrete you are, the better the manager/landlord/subsidy provider will understand you.</p></li>
          <li><img src="assets/img/guide-location/tick.svg" alt="Do:" width="25" height="25" loading="lazy"><p>Make your search profile as specific as possible: What are your requirements? How big should the location be? How much can you pay? And what is its intended purpose?<br><span class="guide-small">(Tip: if it has a cultural purpose, you may qualify for specific subsidies such as the cultural incubator subsidy, and you can even apply for funding for the first months of rent and renovation.)</span></p></li>
        </ul>
      </div>
      <div class="guide-dos-group">
        <h3>DON’T</h3>
        <ul class="guide-dos">
          <li><img src="assets/img/guide-location/cross.svg" alt="Don’t:" width="25" height="25" loading="lazy"><p>Renting locations that are far beyond your budget or for which you would have to take out a loan.</p></li>
        </ul>
      </div>
    </section>

  <article class="guide-article">
    <section id="structure-challenge" aria-labelledby="structure-challenge-h">
      <h2 id="structure-challenge-h">The Challenge</h2>
      <p>A group of women in the neighborhood come together and notice that there are few activities for women. They start working with limited resources and become successful. Now the question is: how do we move forward as an organization?</p>
      <p class="guide-question">What does setting up an organization involve?</p>
    </section>

    <section id="structure-experience" aria-labelledby="structure-experience-h">
      <h2 id="structure-experience-h">From Experience: What (Not) To Do</h2>
      <p>At PEP, a lot of information is available about how to establish a foundation, but in practice, the implementation can be challenging.<br>Members of the CoP have identified various advantages and disadvantages of starting a foundation:</p>
      <p class="guide-label guide-gap">Disadvantages:</p>
      <ul class="guide-bullets guide-bullets--tight">
        <li>Establishing a foundation takes time and commitment. This can be demanding if you’re doing it voluntarily alongside, for example, your job.</li>
        <li>A foundation comes with responsibilities. Not everyone wants to carry that responsibility.</li>
        <li>A foundation can also be vulnerable because it relies on volunteers. Finding replacements for departing board members can be a major challenge.</li>
      </ul>
      <p class="guide-label guide-gap">Advantages:</p>
      <ul class="guide-bullets guide-bullets--tight">
        <li>Other organizations are more likely to find and connect with you if you are a foundation.</li>
        <li>In practice, as a group, you are taken more seriously and recognized when you are a foundation.</li>
        <li>Access to networks becomes easier when you represent a foundation.</li>
        <li>As a foundation, you have more opportunities to apply for funding and subsidies.</li>
        <li>You can recruit volunteers more effectively if your foundation has a clear purpose.</li>
      </ul>
      <p>Building a strong community in your neighborhood, district, or environment is advantageous before setting up a foundation. That means more people will be willing to support you when you start one.</p>
    </section>

    <section id="structure-steps" aria-labelledby="structure-steps-h">
      <h2 id="structure-steps-h">Step-By-Step Plan</h2>
      <ol class="guide-steps">
        <li>
          <h3>Step 1: Volunteer involvement</h3>
          <p>Involve volunteers in the change process and prepare them for the new organizational structure.</p>
        </li>
        <li>
          <h3>Step 2: Establish a core group</h3>
          <p>Establish a core group for the establishment of the foundation.</p>
        </li>
        <li>
          <h3>Step 3: Analyze the situation</h3>
          <p>Analyze the situation: how does it work now and what is going well?</p>
        </li>
        <li>
          <h3>Step 4: The pros and cons</h3>
          <p>Investigate the pros and cons of establishing a foundation.</p>
        </li>
        <li>
          <h3>Step 5: Paperwork</h3>
          <p>Take care of the paperwork for the foundation and decide who does what.</p>
        </li>
        <li>
          <h3>Step 6: Mission &amp; vision</h3>
          <p>Work together to develop a clear vision and mission for the foundation. What do you stand for? What is your goal? What do you want to achieve and why do you want to achieve it? How are you going to achieve your goal?</p>
        </li>
        <li>
          <h3>Step 7: Board members</h3>
          <p>Discuss what type of organizational board you need and which board members are suitable for it.</p>
        </li>
        <li>
          <h3>Step 8: Costs</h3>
          <p>Consider how you will cover the start-up costs, such as notary fees.</p>
        </li>
        <li>
          <h3>Step 9: Address registration</h3>
          <p>Find an address for registration with the Chamber of Commerce.</p>
        </li>
        <li>
          <h3>Step 10: Process supervisor</h3>
          <p>Consider a process supervisor if it is difficult to reach agreement.</p>
        </li>
      </ol>
    </section>

    <section id="structure-checklist" aria-labelledby="structure-checklist-h">
      <h2 id="structure-checklist-h">Checklist</h2>
      <ul class="guide-checklist">
        <li><label class="guide-check"><input type="checkbox"><span>What is the purpose of your organization?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>What does your organization stand for?<br>And what makes your organization different from other (similar) organizations?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>Why is your organization needed in the neighborhood / district / part of the city / the city?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>Will you achieve your goals better as a foundation? Why or why not?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>Which activities do you want to offer? And which do you already offer?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>And which ones do you already offer?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>How large is your organization and how many visitors attend your activities?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>How many volunteers do you have and what tasks do they perform?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>How are decisions made within the organization?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>Who submits project proposals and who coordinates the meetings?</span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>How often do you hold meetings and who is involved?<br><span class="guide-small">What are the topics of discussion?</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>Do you have a leader or spokesperson? <span class="guide-small">Who is it? Is it best for them to work in the board or in the operational activities?</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>What are the most important tasks within your organization?<br><span class="guide-small">Which tasks belong to the board?</span></span></label></li>
        <li><label class="guide-check"><input type="checkbox"><span>Does the board need to perform operational tasks, such as organizing meetings? <span class="guide-small">How often should the board meet?</span></span></label></li>
      </ul>
    </section>

    <section id="structure-dos" class="guide-dos-section" aria-labelledby="structure-dos-h">
      <h2 id="structure-dos-h">Do’s And Don’t’s</h2>
      <div class="guide-dos-group">
        <h3>DO</h3>
        <ul class="guide-dos">
          <li><img src="assets/img/guide-structure/tick.svg" alt="Do:" width="25" height="25" loading="lazy"><p>Start a conversation with other foundations that inspire you. How did they approach this process?</p></li>
          <li><img src="assets/img/guide-structure/tick.svg" alt="Do:" width="25" height="25" loading="lazy"><p>Also research other legal forms, such as a cooperative or an association. Sometimes you can see if your organisation can fall under an existing foundation that shares the same mission. Be sure to make clear agreements in that case.</p></li>
        </ul>
      </div>
      <div class="guide-dos-group">
        <h3>DON’T</h3>
        <ul class="guide-dos">
          <li><img src="assets/img/guide-structure/cross.svg" alt="Don’t:" width="25" height="25" loading="lazy"><p>Don’t assume that everyone can or wants to become a board member.</p></li>
          <li><img src="assets/img/guide-structure/cross.svg" alt="Don’t:" width="25" height="25" loading="lazy"><p>Don’t become a foundation just because you think it will make it easier to get subsidies.</p></li>
        </ul>
      </div>
    </section>

    <nav class="guide-pager" aria-label="Guide navigation">
      <a class="guide-btn guide-btn--back" href="#guide"><img src="assets/img/guide-structure/arrow-left-white.svg" alt="" width="26" height="21" loading="lazy">Back To List</a>

  </aside>

  <article class="guide-article">
    <section class="guide-section" aria-labelledby="frictions-challenge">
      <h2 id="frictions-challenge">The Challenge</h2>
      <p>It’s almost unavoidable: within your organization, different groups form. Sometimes that goes well, but sometimes tensions and conflicts arise.</p>
      <p class="guide-question">How do you make sure everyone feels welcome?</p>
    </section>

    <section class="guide-section" aria-labelledby="frictions-experience">
      <h2 id="frictions-experience">From Experience: What (Not) To Do</h2>
      <p>During the meeting, participants shared various experiences and insights:</p>
      <ul class="guide-bullets">
        <li>The formation of different groups within your organization can happen in various ways. Tensions often arise when one group is overrepresented.</li>
        <li>Clear communication and enforcement of rules can contribute to a stronger sense of community.</li>
        <li>Establishing rules together can foster a greater sense of responsibility and respect within the group.</li>
        <li>Organizing activities at different levels (e.g., based on language skills) can promote inclusion and ensure that everyone feels accepted.</li>
      </ul>
    </section>

    <section class="guide-section" aria-labelledby="frictions-steps">
      <h2 id="frictions-steps">Step-By-Step Plan</h2>
      <ol class="guide-steps">
        <li><h3>Step 1: Analyze the challenges</h3><p>Carefully assess the diversity and needs of the participants.</p></li>
        <li><h3>Step 2: Develop rules and agreements</h3><p>Develop joint rules and agreements: in consultation with the participants, so that there is support for them.</p></li>
        <li><h3>Step 3: Build relationships</h3><p>Make time for relationship building with everyone involved. If you stay in touch with each other, it will be easier to talk about challenges.</p></li>
        <li><h3>Step 4: Diversity</h3><p>Take the diversity within the group into account: for example, by offering certain activities in multiple sessions for different groups.</p></li>
        <li><h3>Step 5: Communication</h3><p>Discuss with each other how you prefer to deal with conflict and how you like to communicate. Yes/no to using WhatsApp? Yes/no to email? Yes/no to group discussions?</p></li>
        <li><h3>Step 6: Evaluate regularly</h3><p>Evaluate regularly with participants. Make adjustments based on feedback.</p></li>
        <li><h3>Step 7: Mediation</h3><p>If you cannot resolve the issue together, bring in a neutral person who can mediate.</p></li>
      </ol>
    </section>

    <section class="guide-section" aria-labelledby="frictions-checklist">
      <h2 id="frictions-checklist">Checklist</h2>
      <ul class="guide-checklist">
        <li><label><input type="checkbox"><span class="guide-check__text">How large is your organization/group? <span class="guide-check__note">Make a distinction between active volunteers and visitors of your meetings/activities.</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">To what extent is there diversity within your organization?<br><span class="guide-check__note">Consider factors such as different ethnic, religious, or cultural backgrounds, different generations, different migration reasons, varying language skills, and different education levels, etc.</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">Als er spanningen of conflicten ontstaan: waar hebben die dan vaak mee te maken? <span class="guide-check__note">Waardoor worden ze volgens jou/jullie veroorzaakt? Hoe gaan jullie daarmee om? Hoe proberen jullie dat op te lossen?</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">If tensions or conflicts arise: what are they often related to?<br><span class="guide-check__note">What do you think causes them? How do you deal with them? How do you try to resolve them?</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">How do you communicate with each other? Do you have a clear point of contact within the organization where people can go if they have a conflict?</span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">How do you ensure that the different groups within your organization feel seen and heard?</span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">Are there external parties or individuals who can support you in finding solutions?</span></label></li>
      </ul>
    </section>

    <section class="guide-section" aria-labelledby="frictions-dos">
      <h2 id="frictions-dos">Do’s And Don’t’s</h2>
      <div class="guide-dos">
        <div>
          <h3>DO</h3>
          <ul>
            <li><img src="assets/img/guide-frictions/tick.svg" alt="Do" width="25" height="25" loading="lazy"><span>Zorg voor een duidelijke structuur en organisatie binnen de groep.</span></li>
            <li><img src="assets/img/guide-frictions/tick.svg" alt="Do" width="25" height="25" loading="lazy"><span>Werk met een gedeelde visie en maak deze zichtbaar.</span></li>
            <li><img src="assets/img/guide-frictions/tick.svg" alt="Do" width="25" height="25" loading="lazy"><span>Geef deelnemers de kans om samen regels op te stellen om meer betrokkenheid te creëren.</span></li>
            <li><img src="assets/img/guide-frictions/tick.svg" alt="Do" width="25" height="25" loading="lazy"><span>Bouw geleidelijk de groepssamenhang op, door verschillende groepen rustig aan elkaar te laten wennen.</span></li>
            <li><img src="assets/img/guide-frictions/tick.svg" alt="Do" width="25" height="25" loading="lazy"><span>Zorg ervoor dat er altijd een persoon is die de regels handhaaft.</span></li>
            <li><img src="assets/img/guide-frictions/tick.svg" alt="Do" width="25" height="25" loading="lazy"><span>Zorg ervoor dat communicatie en thema’s aansluiten bij de leefwereld van de deelnemers.</span></li>
          </ul>
        </div>
        <div>
          <h3>DON’T</h3>
          <ul>
            <li><img src="assets/img/guide-frictions/cross.svg" alt="Don’t" width="25" height="25" loading="lazy"><span>Voorkom afhankelijkheid van één persoon; probeer de organisatie te verdelen.</span></li>
            <li><img src="assets/img/guide-frictions/cross.svg" alt="Don’t" width="25" height="25" loading="lazy"><span>Vermijd het opleggen van regels zonder inspraak van deelnemers.</span></li>
            <li><img src="assets/img/guide-frictions/cross.svg" alt="Don’t" width="25" height="25" loading="lazy"><span>Organiseer geen te grote, ongestructureerde bijeenkomsten, omdat die sneller kunnen leiden tot conflicten.</span></li>
            <li><img src="assets/img/guide-frictions/cross.svg" alt="Don’t" width="25" height="25" loading="lazy"><span>Vermijd te veel focus op een specifieke groep om inclusie te waarborgen.</span></li>
            <li><img src="assets/img/guide-frictions/cross.svg" alt="Don’t" width="25" height="25" loading="lazy"><span>Laat groepsdynamiek niet volledig vrij; structuur en leiding zijn belangrijk voor succes.</span></li>
          </ul>
        </div>
      </div>
    </section>

  <article class="guide-article">
    <section class="guide-section" aria-labelledby="balance-challenge">
      <h2 id="balance-challenge">The Challenge</h2>
      <p>As an organization, you often try to organize activities and gatherings that are as accessible as possible for your target group. You invest a lot of time and energy in your organization, often on a voluntary basis. You usually want your activities or gatherings to be well attended. Ideally, you’d like visitors to eventually become active members of your organization. But how do you ensure that people stay engaged with your organization? How do you motivate people and make sure they remain active? And most importantly:</p>
      <p class="guide-question">How do you find a balance between giving and taking?</p>
    </section>

    <section class="guide-section" aria-labelledby="balance-experience">
      <h2 id="balance-experience">From Experience: What (Not) To Do</h2>
      <ul class="guide-bullets">
        <li><strong>Clear communication:</strong> From day one, rules and expectations should be clear. This prevents confusion and provides structure within the group.</li>
        <li><strong>Screening volunteers:</strong> It’s important to consider motivation and willingness to participate. Occasionally check in with volunteers you haven’t seen for a while to see if they still want to stay active. This way, space is created for new volunteers.</li>
        <li><strong>Membership fees:</strong> Are you an organization that works with paying members? Then it’s important that people continue to pay their fees to cover costs. If some members don’t pay but still use the facilities, it creates unfair situations. Make sure you also have rules for non-paying members and decide how your organization will handle that.</li>
      </ul>
    </section>

    <section class="guide-section" aria-labelledby="balance-steps">
      <h2 id="balance-steps">Step-By-Step Plan</h2>
      <ol class="guide-steps">
        <li><h3>Step 1: Overview</h3><p>Make an overview of your active volunteers. Who are the active volunteers? What exactly do the active volunteers do for your organization? And what role do you play within the organization?</p></li>
        <li><h3>Step 2: Rules and expectations</h3><p>Ensure that members know what is expected of them. When you are devising the rules, involve your volunteers/members in the process. This will give them a sense of ownership of the rules and make them important to them.</p></li>
        <li><h3>Step 3: Consequences</h3><p>Make clear agreements with volunteers about their commitment. Also make clear agreements about what happens if they fail to meet their commitments.</p></li>
        <li><h3>Step 4: Check in</h3><p>Schedule regular check-ins with your volunteers. This means asking your volunteers every so often how they feel things are going and whether they want to continue volunteering (and for how long).</p></li>
        <li><h3>Step 5: Filtering</h3><p>Contact volunteers who have not been active for a while. Talk to them and try to find out why they are no longer active. Ask if they still want to be active and what is feasible for them in terms of commitment and time. Make clear agreements about this.</p></li>
        <li><h3>Step 6: Team building</h3><p>Organize regular activities and meetings to strengthen the group spirit.</p></li>
        <li><h3>Step 7: Appreciation</h3><p>Show appreciation for volunteers, recognize their efforts, and celebrate successes together. A compliment can mean a lot.</p></li>
      </ol>
    </section>

    <section class="guide-section" aria-labelledby="balance-checklist">
      <h2 id="balance-checklist">Checklist</h2>
      <ul class="guide-checklist">
        <li><label><input type="checkbox"><span class="guide-check__text">Are the rules regarding membership and participation clear and communicated to members/volunteers?<br><span class="guide-check__note">In what way do you communicate with each other? Why does it work or not work?</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">Did you come up with the rules together with the volunteers/members?</span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">How are new volunteers/members introduced to the organization and to other volunteers/members?<br><span class="guide-check__note">Do you also explain the rules to new volunteers/members? Why or why not?</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">Do you discuss expectations, tasks, and time commitment with new volunteers? <span class="guide-check__note">Do you also discuss with them how long they want to remain a volunteer?</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">Are new volunteers allowed to discuss their preferences and strengths and use them within the organization?</span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">What do you do with volunteers who haven’t been in touch for a long time or are no longer very active?<br><span class="guide-check__note">Have you also established rules for how to handle this?</span></span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">Do you also do activities together to strengthen the sense of group cohesion?</span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">When you achieve a success, do you celebrate it? How do you celebrate it?</span></label></li>
        <li><label><input type="checkbox"><span class="guide-check__text">Do you regularly discuss collaboration? How often?<br><span class="guide-check__note">Do you address successes and challenges? Do these kinds of discussions lead to improvement?</span></span></label></li>
      </ul>
    </section>

    <section class="guide-section" aria-labelledby="balance-dos">

            <li><img src="assets/img/guide-balance/tick.svg" alt="Do" width="25" height="25" loading="lazy"><span>Zorg voor heldere en conse uente communicatie. Geen duidelijke regels en structuur hebben.</span></li>

  <article class="guide-article">
    <section class="guide-section" aria-labelledby="generations-challenge">
      <h2 id="generations-challenge">The Challenge</h2>
      <p>Some members of the Community of Practice, ‘Kracht(vrouwen) in de wijk’, work not only with adult women but also with young girls. Often, these are mothers and their daughters from the same neighborhood. Through this direct involvement, participants gain valuable insights into the living environments of both generations. At the same time, several members notice that a gap is emerging between these two worlds. Differences in values, expectations, and communication cause tension or misunderstandings. As a professional working with both groups, you find yourself right in the middle of these generations.</p>
      <p class="guide-question">How do you unite different generations?</p>
    </section>

    <section class="guide-section" aria-labelledby="generations-experience">
      <h2 id="generations-experience">From Experience: What (Not) To Do</h2>
      <ul class="guide-bullets">
        <li>Participants of ‘Kracht(vrouwen) in de wijk’ see in their work that young people often have questions their parents are unaware of. Whether or not the parents are informed, they often don’t know how to address these topics.</li>
        <li>A gap between parents and growing adolescents has always existed. However, issues such as social media, influencers, the COVID-19 pandemic, and growing up with discrimination make this era different. The challenges parents and young people face have changed accordingly.</li>
        <li>The fact that young people (and often mothers) turn to these participants and confide in them is a sign that these organizations provide safe spaces for them.</li>
        <li>These participants are seen as trusted figures, which often means that parents also have expectations of them when it comes to their children. Participants sometimes feel pressured to guide young people in difficult choices that the parents themselves struggle to address.</li>
        <li>Not all women’s organizations are involved in support work. Yet they often end up doing so, as women’s organizations are seen as safe spaces where health and mental well-being can be discussed.</li>
        <li>Because of the trust placed in them, these participants have become important figures for both young people and adults. However, this role is not always clear. Are they confidants, professionals, or activity facilitators? These roles often overlap.</li>
        <li>Young people need space to express themselves, but you also want to be able to act preventively — for example, against violence or the possession of weapons.</li>
        <li>Discussing taboos is essential, which means you also need to encourage open conversations about them. You do this not only preventively but also by setting an example.</li>
        <li>An important lesson you can pass on is: “Stay true to who you are, even if you can’t change others.” You can inspire others simply by being yourself, especially when you are seen as a role model.</li>
      </ul>
    </section>

    <section class="guide-section" aria-labelledby="generations-steps">
      <h2 id="generations-steps">Step-By-Step Plan</h2>
      <ol class="guide-steps">
        <li><h3>Step 1: Starting point</h3><p>The questions for help will clarify where you stand as an organization. What does the gap between young people and their parents look like within your organization? Is your organization a place where people can go if they are struggling with something or need help? The most important question is whether you want to be/become an organization that provides support. Discuss this with your teammates.</p></li>
        <li><h3>Step 2: Set boundaries</h3><p>If people often come to you for a listening ear or confide in you, it is important to set boundaries. Sometimes certain issues can affect you deeply. And sometimes you end up spending much more time on them than you had anticipated. Set your own boundaries when it comes to your time and energy. It is okay to say no sometimes.</p></li>
        <li><h3>Step 3: Create a safe environment</h3><p>Give people the space to tell their story. Above all, listen. Do not judge or condemn. Think together about how you prefer to interact and communicate with each other. You can draw up a number of rules together. For example: if you do not understand someone's story, ask questions and do not fill in the blanks for them.</p></li>
        <li><h3>Step 4: Team building</h3><p>To bridge the gap between young people and their parents and strengthen the bond between them, you could organize more relaxed activities for both groups. These could include cooking together or a city trip in the Netherlands.</p></li>
        <li><h3>Step 5: Coaches and sparring partners</h3><p>Are you often seen as a confidant, but do you sometimes find this role difficult? Then find a coach or sparring partner in your network who can help you with this.</p></li>
        <li><h3>Step 6: Collaboration with professionals</h3><p>Sometimes it is useful to collaborate with the Municipal Health Service (GGD), a youth care nurse, or other care and support professionals. It is important to make clear agreements with each other. What kind of collaboration are you entering into? What exactly are you going to do? What exactly do you want to achieve? Who will perform which tasks? How much time will this take? And very importantly: what about financial compensation? Make sure you create as many agreements as possible.</p></li>
        <li><h3>Step 7: Long term</h3><p>Bridging a gap and building trust is a process and takes time. Trial and error is part of that process. Don't be too hard on yourself if things don't go as you had hoped.</p></li>
      </ol>
    </section>
